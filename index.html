<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🤡 Le Clown Rigolo — French Body Parts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', cursive, sans-serif; }
  body { background: linear-gradient(135deg, #ffe0b2, #fff9c4); min-height: 100vh; padding: 15px; }
  .header { display: flex; justify-content: space-between; align-items: center; background: #ff7043; color: white; padding: 12px 20px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 0 #d84315; }
  .header h1 { font-size: 24px; }
  .stats { display: flex; gap: 15px; font-size: 18px; }
  .progress-bar { background: #ffccbc; height: 14px; border-radius: 7px; overflow: hidden; margin-bottom: 15px; }
  .progress-fill { background: linear-gradient(90deg, #66bb6a, #43a047); height: 100%; width: 0%; transition: width 0.5s; }
  .modes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; justify-content: center; }
  .mode-btn { padding: 10px 16px; border: none; border-radius: 20px; background: white; cursor: pointer; font-size: 14px; font-weight: bold; box-shadow: 0 3px 0 #bdbdbd; transition: all 0.2s; }
  .mode-btn:hover { transform: translateY(-2px); }
  .mode-btn.active { background: #ffd54f; box-shadow: 0 3px 0 #f9a825; }
  .game-area { background: white; border-radius: 20px; padding: 20px; min-height: 500px; box-shadow: 0 6px 0 #e0e0e0; position: relative; }
  .hint { background: #e3f2fd; padding: 10px 15px; border-radius: 10px; margin-top: 10px; font-size: 14px; color: #1565c0; }
  .feedback { position: absolute; top: 20px; right: 20px; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 18px; opacity: 0; transition: opacity 0.3s; z-index: 10; }
  .feedback.show { opacity: 1; }
  .feedback.correct { background: #c8e6c9; color: #2e7d32; }
  .feedback.wrong { background: #ffcdd2; color: #c62828; }

  .clown-container { display: flex; justify-content: center; margin: 20px 0; }
  svg { max-width: 400px; height: auto; }
  .body-part { cursor: pointer; transition: all 0.2s; }
  .body-part:hover { filter: brightness(1.15); }
  .body-part.highlight { animation: pulse 0.6s infinite; }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.5); stroke: #ffeb3b; stroke-width: 3; } }

  .labels-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 15px; }
  .label { padding: 8px 14px; background: #fff59d; border: 2px dashed #f9a825; border-radius: 10px; cursor: grab; font-weight: bold; user-select: none; }
  .label.dragging { opacity: 0.5; }
  .label.placed { background: #c8e6c9; border-color: #43a047; cursor: default; }

  .memory-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-width: 600px; margin: 20px auto; }
  .memory-card { aspect-ratio: 1; background: #ff7043; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; font-weight: bold; color: white; text-align: center; padding: 5px; transition: background 0.3s, color 0.3s; }
  .memory-card.flipped { background: #fff9c4; color: #333; }
  .memory-card.matched { background: #a5d6a7; color: #1b5e20; cursor: default; }

  .speed-prompt { text-align: center; font-size: 26px; margin: 20px 0; color: #d84315; font-weight: bold; min-height: 60px; }
  .timer { font-size: 32px; text-align: center; color: #c62828; }

  .board-top { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 15px 0; }
  .dice { font-size: 60px; cursor: pointer; user-select: none; transition: transform 0.3s; }
  .dice:hover { transform: scale(1.1); }
  .dice.rolling { animation: roll 0.5s; }
  @keyframes roll { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
  .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 600px; margin: 10px auto; }
  .board-cell { aspect-ratio: 1; background: #ffe0b2; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; padding: 5px; position: relative; border: 2px solid #ffb74d; }
  .board-cell.start { background: #a5d6a7; }
  .board-cell.finish { background: #ffd54f; }
  .player-token { position: absolute; width: 22px; height: 22px; background: #e53935; border-radius: 50%; border: 2px solid white; bottom: 3px; right: 3px; z-index: 2; }
  .board-question { margin-top: 15px; text-align: center; background: #f5f5f5; padding: 15px; border-radius: 12px; min-height: 80px; }

  .btn { padding: 12px 24px; background: #42a5f5; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #1976d2; margin: 5px; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1976d2; }
  .btn-option { padding: 10px 16px; font-size: 14px; }

  .intro-text { text-align: center; font-size: 18px; color: #5d4037; margin: 15px 0; }
</style>
</head>
<body>

<div class="header">
  <h1>🤡 Le Clown Rigolo</h1>
  <div class="stats">
    <span>⭐ <span id="score">0</span></span>
    <span>❤️ <span id="lives">3</span></span>
    <span>🏆 Lv.<span id="level">1</span></span>
  </div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

<div class="modes">
  <button class="mode-btn active" data-mode="learn">📚 Learn</button>
  <button class="mode-btn" data-mode="drag">✋ Drag</button>
  <button class="mode-btn" data-mode="listen"> Listen</button>
  <button class="mode-btn" data-mode="memory">🃏 Memory</button>
  <button class="mode-btn" data-mode="speed">⚡ Speed</button>
  <button class="mode-btn" data-mode="board">🎲 Board</button>
</div>

<div class="game-area">
  <div class="feedback" id="feedback"></div>
  <div id="game-content"></div>
  <div class="hint" id="hint">Hover over the clown to learn the words!</div>
</div>

<script>
// ===== VOCABULARY =====
const vocab = [
  { fr: 'une tête', en: 'head', part: 'tete', emoji: '🗣️' },
  { fr: 'un visage', en: 'face', part: 'visage', emoji: '😊' },
  { fr: 'les cheveux', en: 'hair', part: 'cheveux', emoji: '💇' },
  { fr: 'les yeux', en: 'eyes', part: 'yeux', emoji: '👀' },
  { fr: 'une joue', en: 'cheek', part: 'joue', emoji: '' },
  { fr: 'un nez', en: 'nose', part: 'nez', emoji: '👃' },
  { fr: 'une oreille', en: 'ear', part: 'oreille', emoji: '👂' },
  { fr: 'une bouche', en: 'mouth', part: 'bouche', emoji: '👄' },
  { fr: 'un bras', en: 'arm', part: 'bras', emoji: '💪' },
  { fr: 'une main', en: 'hand', part: 'main', emoji: '✋' },
  { fr: 'une jambe', en: 'leg', part: 'jambe', emoji: '' },
  { fr: 'un pied', en: 'foot', part: 'pied', emoji: '🦶' }
];

const functions = [
  { part: 'nez', func: 'pour sentir', en: 'to smell' },
  { part: 'yeux', func: 'pour regarder et voir', en: 'to look and see' },
  { part: 'mains', func: 'pour écrire, peindre et applaudir', en: 'to write, paint and clap', singular: 'main' },
  { part: 'pieds', func: 'pour courir, marcher et sauter', en: 'to run, walk and jump', singular: 'pied' },
  { part: 'bouche', func: 'pour manger, boire et rire', en: 'to eat, drink and laugh' },
  { part: 'tête', func: 'pour penser', en: 'to think', singular: 'tete' },
  { part: 'oreilles', func: 'pour écouter et parler', en: 'to listen and speak', singular: 'oreille' }
];

// ===== STATE =====
let state = {
  score: 0, lives: 3, level: 1,
  currentMode: 'learn',
  placed: new Set(),
  memoryFlipped: [],
  memoryMatched: 0,
  memoryCards: [],
  speedTime: 60,
  speedTimer: null,
  speedScore: 0,
  boardPos: 0,
  boardTotal: 20
};

// ===== SVG CLOWN =====
function getClownSVG(highlightPart = null) {
  const hl = (id) => highlightPart === id ? 'highlight' : '';
  return `
  <svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
    <g class="body-part ${hl('cheveux')}" data-part="cheveux">
      <circle cx="100" cy="90" r="25" fill="#ff8a65"/>
      <circle cx="200" cy="90" r="25" fill="#ff8a65"/>
      <circle cx="90" cy="120" r="20" fill="#ff8a65"/>
      <circle cx="210" cy="120" r="20" fill="#ff8a65"/>
    </g>
    
    <circle class="body-part ${hl('tete')}" data-part="tete" 
            cx="150" cy="110" r="55" 
            fill="none" stroke="#ffab91" stroke-width="12" 
            opacity="0.9"/>
    <circle cx="150" cy="110" r="48" fill="#ffccbc" pointer-events="none"/>
    
    <circle class="body-part ${hl('visage')}" data-part="visage" 
            cx="150" cy="115" r="22" 
            fill="#ffe0b2" stroke="#ff8a65" stroke-width="2" stroke-dasharray="3"/>
    
    <g class="body-part ${hl('yeux')}" data-part="yeux">
      <circle cx="135" cy="105" r="6" fill="white"/><circle cx="135" cy="105" r="3" fill="black"/>
      <circle cx="165" cy="105" r="6" fill="white"/><circle cx="165" cy="105" r="3" fill="black"/>
    </g>
    
    <g class="body-part ${hl('joue')}" data-part="joue">
      <circle cx="120" cy="125" r="8" fill="#f48fb1" opacity="0.7"/>
      <circle cx="180" cy="125" r="8" fill="#f48fb1" opacity="0.7"/>
    </g>
    
    <circle class="body-part ${hl('nez')}" data-part="nez" cx="150" cy="120" r="10" fill="#e53935"/>
    
    <g class="body-part ${hl('oreille')}" data-part="oreille">
      <ellipse cx="100" cy="110" rx="8" ry="12" fill="#ffab91"/>
      <ellipse cx="200" cy="110" rx="8" ry="12" fill="#ffab91"/>
    </g>
    
    <ellipse class="body-part ${hl('bouche')}" data-part="bouche" 
             cx="150" cy="140" rx="18" ry="8" 
             fill="#ff5252" stroke="#c62828" stroke-width="2"/>
    
    <path d="M 110 70 L 150 30 L 190 70 Z" fill="#66bb6a" pointer-events="none"/>
    <ellipse cx="150" cy="70" rx="50" ry="8" fill="#43a047" pointer-events="none"/>
    
    <rect x="120" y="160" width="60" height="80" fill="#ffd54f" rx="10" pointer-events="none"/>
    <circle cx="150" cy="190" r="10" fill="#e91e63" pointer-events="none"/>
    
    <g class="body-part ${hl('bras')}" data-part="bras">
      <rect x="70" y="170" width="50" height="18" fill="#4fc3f7" rx="9" transform="rotate(-20 95 179)"/>
      <rect x="180" y="170" width="50" height="18" fill="#4fc3f7" rx="9" transform="rotate(20 205 179)"/>
    </g>
    
    <g class="body-part ${hl('main')}" data-part="main">
      <circle cx="65" cy="195" r="12" fill="#ffccbc"/>
      <circle cx="235" cy="195" r="12" fill="#ffccbc"/>
    </g>
    
    <g class="body-part ${hl('jambe')}" data-part="jambe">
      <rect x="125" y="240" width="20" height="90" fill="#7e57c2" rx="5"/>
      <rect x="155" y="240" width="20" height="90" fill="#7e57c2" rx="5"/>
    </g>
    
    <g class="body-part ${hl('pied')}" data-part="pied">
      <ellipse cx="135" cy="340" rx="22" ry="10" fill="#ffeb3b"/>
      <ellipse cx="165" cy="340" rx="22" ry="10" fill="#ffeb3b"/>
    </g>
  </svg>`;
}

// ===== TTS =====
function speak(text) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR'; u.rate = 0.85;
    speechSynthesis.speak(u);
  }
}

// ===== FEEDBACK =====
function showFeedback(msg, correct) {
  const f = document.getElementById('feedback');
  f.textContent = msg;
  f.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
  setTimeout(() => f.classList.remove('show'), 1500);
}

function addScore(pts) {
  state.score += pts;
  document.getElementById('score').textContent = state.score;
  updateProgress();
}

function updateProgress() {
  const max = 200;
  const pct = Math.min(100, (state.score / max) * 100);
  document.getElementById('progress').style.width = pct + '%';
  const newLevel = Math.floor(state.score / 30) + 1;
  if (newLevel > state.level) { state.level = newLevel; document.getElementById('level').textContent = state.level; }
}

// ===== MODE SWITCHING =====
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.currentMode = btn.dataset.mode;
    clearInterval(state.speedTimer);
    renderMode();
  });
});

function renderMode() {
  const content = document.getElementById('game-content');
  const hint = document.getElementById('hint');
  switch(state.currentMode) {
    case 'learn': renderLearn(content, hint); break;
    case 'drag': renderDrag(content, hint); break;
    case 'listen': renderListen(content, hint); break;
    case 'memory': renderMemory(content, hint); break;
    case 'speed': renderSpeed(content, hint); break;
    case 'board': renderBoard(content, hint); break;
  }
}

// ===== 1. LEARN =====
function renderLearn(content, hint) {
  hint.innerHTML = '💡 Clique sur une partie du corps pour entendre le mot!';
  content.innerHTML = `
    <p class="intro-text">Explore le clown! 🤡</p>
    <div class="clown-container">${getClownSVG()}</div>
    <div class="labels-pool">
      ${vocab.map(v => `<span class="label">${v.fr} <small style="color:#666">(${v.en})</small></span>`).join('')}
    </div>
  `;
  attachClownHandlers(content, (part) => {
    const word = vocab.find(v => v.part === part);
    if (word) { speak(word.fr); showFeedback(word.fr + ' = ' + word.en, true); }
  }, (part) => {
    const word = vocab.find(v => v.part === part);
    if (word) hint.innerHTML = `💡 <b>${word.fr}</b> = ${word.en}`;
  });
}

// ===== 2. DRAG & DROP =====
function renderDrag(content, hint) {
  hint.innerHTML = '💡 Drag each word to the correct body part!';
  const shuffled = [...vocab].sort(() => Math.random() - 0.5);
  state.placed = new Set();
  content.innerHTML = `
    <p class="intro-text">Glisse les mots sur le clown!</p>
    <div class="clown-container">${getClownSVG()}</div>
    <div class="labels-pool" id="labels-pool">
      ${shuffled.map(v => `<div class="label" draggable="true" data-part="${v.part}">${v.fr}</div>`).join('')}
    </div>
    <p style="text-align:center;margin-top:10px;">Placed: <span id="placed-count">0</span>/12</p>
  `;
  setupDragDrop();
}

let draggedPart = null;
document.addEventListener('dragstart', e => {
  if (e.target.classList.contains('label')) {
    draggedPart = e.target.dataset.part;
  }
});

function setupDragDrop() {
  const labels = document.querySelectorAll('.label[draggable]');
  labels.forEach(lbl => {
    lbl.addEventListener('dragstart', e => {
      lbl.classList.add('dragging');
      e.dataTransfer.setData('text/plain', lbl.dataset.part);
    });
    lbl.addEventListener('dragend', () => lbl.classList.remove('dragging'));
  });
  attachClownHandlers(document.getElementById('game-content'), null, null, true);
}

function attachClownHandlers(container, onClick, onHover, dragMode = false) {
  container.querySelectorAll('.body-part').forEach(el => {
    if (dragMode) {
      el.addEventListener('dragover', e => { e.preventDefault(); el.style.filter = 'brightness(1.3)'; });
      el.addEventListener('dragleave', () => { el.style.filter = ''; });
      el.addEventListener('drop', e => {
        e.preventDefault();
        el.style.filter = '';
        const targetPart = el.dataset.part;
        if (draggedPart === targetPart && !state.placed.has(draggedPart)) {
          state.placed.add(draggedPart);
          const lbl = document.querySelector(`.label[data-part="${draggedPart}"]`);
          if (lbl) { lbl.classList.add('placed'); lbl.draggable = false; }
          speak(vocab.find(v => v.part === draggedPart).fr);
          showFeedback('✅ Bravo!', true);
          addScore(5);
          document.getElementById('placed-count').textContent = state.placed.size;
          if (state.placed.size === 12) {
            setTimeout(() => { alert('🎉 Félicitations! All 12 placed! +20 bonus!'); addScore(20); }, 500);
          }
        } else {
          showFeedback('❌ Essaie encore!', false);
          state.lives = Math.max(0, state.lives - 1);
          document.getElementById('lives').textContent = state.lives;
        }
        draggedPart = null;
      });
    } else {
      el.addEventListener('click', () => { if (onClick) onClick(el.dataset.part); });
      el.addEventListener('mouseenter', () => { if (onHover) onHover(el.dataset.part); });
    }
  });
}

// ===== 3. LISTEN & CLICK — ИСПРАВЛЕНО: только части тела =====
let listenTarget = null;
function renderListen(content, hint) {
  hint.innerHTML = '🔊 Listen and click the correct body part!';
  nextListenQuestion(content, hint);
}

function nextListenQuestion(content, hint) {
  // ТОЛЬКО части тела, без функций!
  const target = vocab[Math.floor(Math.random() * vocab.length)];
  listenTarget = target;
  
  content.innerHTML = `
    <p class="intro-text">🔊 Écoute et clique!<br><small>(Listen and click!)</small></p>
    <button class="btn" id="play-btn">🔊 Réécouter</button>
    <div class="clown-container">${getClownSVG()}</div>
  `;
  
  document.getElementById('play-btn').addEventListener('click', () => speak(target.fr));
  setTimeout(() => speak(target.fr), 400);
  
  attachClownHandlers(content, (part) => {
    if (part === listenTarget.part) {
      showFeedback('✅ Correct! ' + listenTarget.fr, true);
      addScore(10);
      setTimeout(() => nextListenQuestion(content, hint), 1200);
    } else {
      showFeedback('❌ Non! Try again', false);
      state.lives = Math.max(0, state.lives - 1);
      document.getElementById('lives').textContent = state.lives;
      if (state.lives === 0) {
        setTimeout(() => {
          alert('💔 Game Over! Score: ' + state.score);
          state.lives = 3; state.score = Math.max(0, state.score - 20);
          document.getElementById('lives').textContent = 3;
          document.getElementById('score').textContent = state.score;
          nextListenQuestion(content, hint);
        }, 500);
      }
    }
  });
}

// ===== 4. MEMORY =====
function renderMemory(content, hint) {
  hint.innerHTML = '🃏 Find all 12 pairs! (word ↔ emoji)';
  state.memoryFlipped = []; state.memoryMatched = 0;
  const cards = [];
  vocab.forEach(v => {
    cards.push({ id: v.part, text: v.fr, type: 'word' });
    cards.push({ id: v.part, text: v.emoji, type: 'emoji' });
  });
  cards.sort(() => Math.random() - 0.5);
  state.memoryCards = cards;
  
  content.innerHTML = `
    <p class="intro-text">Trouve les paires! — Matched: <span id="mem-count">0</span>/12</p>
    <div class="memory-grid" id="mem-grid">
      ${cards.map((c, i) => `<div class="memory-card" data-idx="${i}">?</div>`).join('')}
    </div>
  `;
  
  document.querySelectorAll('.memory-card').forEach(card => {
    card.addEventListener('click', () => {
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
      if (state.memoryFlipped.length >= 2) return;
      
      const idx = parseInt(card.dataset.idx);
      const data = cards[idx];
      
      card.textContent = data.text;
      card.classList.add('flipped');
      state.memoryFlipped.push({ card, idx, data });
      
      if (state.memoryFlipped.length === 2) {
        const [a, b] = state.memoryFlipped;
        if (a.data.id === b.data.id && a.data.type !== b.data.type) {
          setTimeout(() => {
            a.card.classList.add('matched');
            b.card.classList.add('matched');
            speak(vocab.find(v => v.part === a.data.id).fr);
            state.memoryMatched++;
            document.getElementById('mem-count').textContent = state.memoryMatched;
            addScore(5);
            state.memoryFlipped = [];
            if (state.memoryMatched === 12) {
              setTimeout(() => { alert('🎉 All pairs found! +25 bonus!'); addScore(25); }, 500);
            }
          }, 600);
        } else {
          setTimeout(() => {
            a.card.textContent = '?';
            b.card.textContent = '?';
            a.card.classList.remove('flipped');
            b.card.classList.remove('flipped');
            state.memoryFlipped = [];
          }, 900);
        }
      }
    });
  });
}

// ===== 5. SPEED ROUND — ИСПРАВЛЕНО: с действиями + правильное сопоставление =====
function renderSpeed(content, hint) {
  hint.innerHTML = '⚡ 60 seconds! Answer as many as you can!';
  state.speedTime = 60;
  state.speedScore = 0;
  
  content.innerHTML = `
    <p class="intro-text">⚡ Rapid!</p>
    <div class="timer">⏱️ <span id="timer-val">60</span>s</div>
    <div class="speed-prompt" id="speed-prompt">Prêt?</div>
    <div class="clown-container">${getClownSVG()}</div>
    <p style="text-align:center;">Score this round: <span id="speed-score">0</span></p>
  `;
  
  let currentTarget = null;
  const nextQuestion = () => {
    // 60% вопросов — действия, 40% — просто слова
    const useFunction = Math.random() > 0.4;
    
    if (useFunction) {
      const f = functions[Math.floor(Math.random() * functions.length)];
      // ИСПРАВЛЕНО: правильно сопоставляем singular/part
      const targetPart = f.singular || f.part;
      currentTarget = { type: 'function', part: targetPart, text: f.func };
      document.getElementById('speed-prompt').innerHTML = `Qu'est-ce qu'on utilise<br><b>${f.func}</b>?`;
      speak(`Qu'est-ce qu'on utilise ${f.func}?`);
    } else {
      const v = vocab[Math.floor(Math.random() * vocab.length)];
      currentTarget = { type: 'vocab', part: v.part, text: v.fr };
      document.getElementById('speed-prompt').textContent = 'Où est... ' + v.fr + ' ?';
      speak(v.fr);
    }
  };
  
  setTimeout(nextQuestion, 800);
  
  attachClownHandlers(content, (part) => {
    if (!currentTarget) return;
    // ИСПРАВЛЕНО: проверяем совпадение правильно
    const correct = part === currentTarget.part;
    if (correct) {
      state.speedScore++;
      document.getElementById('speed-score').textContent = state.speedScore;
      addScore(3);
      showFeedback('✅', true);
      nextQuestion();
    } else {
      showFeedback('❌', false);
    }
  });
  
  state.speedTimer = setInterval(() => {
    state.speedTime--;
    document.getElementById('timer-val').textContent = state.speedTime;
    if (state.speedTime <= 0) {
      clearInterval(state.speedTimer);
      document.getElementById('speed-prompt').textContent = '⏰ Temps écoulé! Score: ' + state.speedScore;
      setTimeout(() => alert('⏰ Time! You got ' + state.speedScore + ' correct!'), 300);
    }
  }, 1000);
}

// ===== 6. BOARD GAME =====
function renderBoard(content, hint) {
  hint.innerHTML = '🎲 Click the dice to roll! Answer to move.';
  
  content.innerHTML = `
    <p class="intro-text">🎲 Lance le dé et réponds pour avancer!</p>
    
    <div class="board-top">
      <div class="dice" id="dice" title="Click to roll!">🎲</div>
      <div style="font-size:18px;">Position: <b id="board-pos">0</b>/${state.boardTotal-1}</div>
      <div style="font-size:18px;">Roll: <b id="last-roll">-</b></div>
    </div>
    
    <div class="board" id="board-grid">
      ${Array.from({length: state.boardTotal}, (_, i) => {
        let cls = 'board-cell';
        if (i === 0) cls += ' start';
        if (i === state.boardTotal - 1) cls += ' finish';
        return `<div class="${cls}" id="cell-${i}">${i === 0 ? '🏁 Start' : i === state.boardTotal-1 ? '🏁 Finish' : i}</div>`;
      }).join('')}
    </div>
    
    <div class="board-question" id="board-question">
      <p style="font-size:16px;color:#5d4037;">🎲 Click the dice to start!</p>
    </div>
  `;
  
  updateBoardToken();
  document.getElementById('dice').addEventListener('click', rollDice);
}

function rollDice() {
  const dice = document.getElementById('dice');
  if (!dice || dice.classList.contains('rolling')) return;
  
  dice.classList.add('rolling');
  const roll = Math.floor(Math.random() * 6) + 1;
  const diceEmojis = ['⚀','⚁','⚂','⚃','⚄','⚅'];
  
  setTimeout(() => {
    dice.textContent = diceEmojis[roll-1];
    dice.classList.remove('rolling');
    document.getElementById('last-roll').textContent = roll;
    speak(roll.toString());
    setTimeout(() => askBoardQuestion(roll), 400);
  }, 500);
}

function askBoardQuestion(roll) {
  const useFunction = Math.random() > 0.4;
  let q, correct, options, correctLabel;
  
  if (useFunction) {
    const f = functions[Math.floor(Math.random() * functions.length)];
    q = `${f.func} — c'est... ?`;
    correct = f.singular || f.part;
    const allParts = functions.map(x => x.singular || x.part);
    options = [correct, ...allParts.filter(x => x !== correct).slice(0, 2)];
    correctLabel = vocab.find(v => v.part === correct)?.fr || correct;
  } else {
    const v = vocab[Math.floor(Math.random() * vocab.length)];
    const qType = Math.random() > 0.5;
    if (qType) {
      q = `Comment dit-on "${v.en}" en français?`;
      correct = v.part;
      const allParts = vocab.map(x => x.part);
      options = [correct, ...allParts.filter(x => x !== correct).slice(0, 2)];
      correctLabel = v.fr;
    } else {
      q = `"${v.fr}" — c'est... ?`;
      correct = v.en;
      const allEn = vocab.map(x => x.en);
      options = [v.en, ...allEn.filter(x => x !== v.en).slice(0, 2)];
      correctLabel = v.en;
    }
  }
  
  options.sort(() => Math.random() - 0.5);
  
  const div = document.getElementById('board-question');
  div.innerHTML = `
    <p style="font-size:18px;margin:10px;color:#d84315;font-weight:bold;">${q}</p>
    <div>${options.map(o => {
      const label = (useFunction || (q.includes('dit-on') && !q.includes('c\'est'))) 
        ? (vocab.find(v => v.part === o)?.fr || o) 
        : o;
      return `<button class="btn btn-option" data-val="${o}">${label}</button>`;
    }).join('')}</div>
  `;
  
  div.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.val === correct) {
        showFeedback('✅ Correct!', true);
        const word = vocab.find(v => v.part === correct) || vocab.find(v => v.en === correct);
        if (word) speak(word.fr);
        state.boardPos = Math.min(state.boardTotal - 1, state.boardPos + roll);
        addScore(8);
        updateBoardToken();
        div.innerHTML = `<p style="color:#2e7d32;font-size:18px;">🎉 Avance de ${roll}! Position: ${state.boardPos}</p>`;
        if (state.boardPos === state.boardTotal - 1) {
          setTimeout(() => { alert('🏆 Bravo! You reached the finish! +30 bonus!'); addScore(30); }, 500);
        }
      } else {
        showFeedback('❌ Wrong! Stay here.', false);
        div.innerHTML = `<p style="color:#c62828;font-size:16px;"> Mauvaise réponse. Réessaie au prochain tour!</p>`;
      }
    });
  });
}

function updateBoardToken() {
  document.querySelectorAll('.player-token').forEach(t => t.remove());
  const cell = document.getElementById('cell-' + state.boardPos);
  if (cell) {
    const token = document.createElement('div');
    token.className = 'player-token';
    cell.appendChild(token);
  }
  const posEl = document.getElementById('board-pos');
  if (posEl) posEl.textContent = state.boardPos;
}

// ===== INIT =====
renderMode();
</script>
