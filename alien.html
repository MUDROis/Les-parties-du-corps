<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>👽 Zorglub l'Alien — French Body Parts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', cursive, sans-serif; }
  body { background: linear-gradient(135deg, #1a237e, #4a148c, #880e4f); min-height: 100vh; padding: 15px; color: white; }
  .header { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: white; padding: 12px 20px; border-radius: 15px; margin-bottom: 15px; border: 2px solid rgba(255,255,255,0.2); }
  .header h1 { font-size: 24px; }
  .stats { display: flex; gap: 15px; font-size: 18px; }
  .progress-bar { background: rgba(255,255,255,0.2); height: 14px; border-radius: 7px; overflow: hidden; margin-bottom: 15px; }
  .progress-fill { background: linear-gradient(90deg, #00e676, #00c853); height: 100%; width: 0%; transition: width 0.5s; }
  .modes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; justify-content: center; }
  .mode-btn { padding: 10px 16px; border: none; border-radius: 20px; background: rgba(255,255,255,0.2); cursor: pointer; font-size: 14px; font-weight: bold; border: 2px solid rgba(255,255,255,0.3); transition: all 0.2s; color: white; }
  .mode-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.3); }
  .mode-btn.active { background: #00e676; color: #1a237e; box-shadow: 0 0 20px #00e676; }
  .game-area { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; min-height: 500px; border: 2px solid rgba(255,255,255,0.1); position: relative; }
  .hint { background: rgba(0,230,118,0.2); padding: 10px 15px; border-radius: 10px; margin-top: 10px; font-size: 14px; color: #00e676; border: 1px solid rgba(0,230,118,0.3); }
  .feedback { position: absolute; top: 20px; right: 20px; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 18px; opacity: 0; transition: opacity 0.3s; z-index: 10; }
  .feedback.show { opacity: 1; }
  .feedback.correct { background: #00e676; color: #1a237e; }
  .feedback.wrong { background: #ff5252; color: white; }

  .alien-container { display: flex; justify-content: center; margin: 20px 0; }
  svg { max-width: 400px; height: auto; }
  .body-part { cursor: pointer; transition: all 0.2s; }
  .body-part:hover { filter: brightness(1.3) drop-shadow(0 0 10px rgba(0,230,118,0.8)); }
  .body-part.highlight { animation: pulse 0.6s infinite; }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.5); stroke: #00e676; stroke-width: 3; } }

  .labels-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 15px; }
  .label { padding: 8px 14px; background: rgba(0,230,118,0.2); border: 2px dashed #00e676; border-radius: 10px; cursor: grab; font-weight: bold; user-select: none; }
  .label.dragging { opacity: 0.5; }
  .label.placed { background: #00e676; color: #1a237e; cursor: default; }

  .memory-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-width: 600px; margin: 20px auto; }
  .memory-card { aspect-ratio: 1; background: #7c4dff; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; font-weight: bold; color: white; text-align: center; padding: 5px; transition: background 0.3s, color 0.3s; border: 2px solid rgba(255,255,255,0.3); }
  .memory-card.flipped { background: rgba(255,255,255,0.9); color: #1a237e; }
  .memory-card.matched { background: #00e676; color: #1a237e; cursor: default; }

  .speed-prompt { text-align: center; font-size: 26px; margin: 20px 0; color: #00e676; font-weight: bold; min-height: 60px; }
  .timer { font-size: 32px; text-align: center; color: #ff5252; }

  .board-top { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 15px 0; }
  .dice { font-size: 60px; cursor: pointer; user-select: none; transition: transform 0.3s; }
  .dice:hover { transform: scale(1.1); }
  .dice.rolling { animation: roll 0.5s; }
  @keyframes roll { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
  .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 600px; margin: 10px auto; }
  .board-cell { aspect-ratio: 1; background: rgba(255,255,255,0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; padding: 5px; position: relative; border: 2px solid rgba(255,255,255,0.2); }
  .board-cell.start { background: rgba(0,230,118,0.3); }
  .board-cell.finish { background: rgba(255,215,0,0.3); }
  .player-token { position: absolute; width: 22px; height: 22px; background: #00e676; border-radius: 50%; border: 2px solid white; bottom: 3px; right: 3px; z-index: 2; box-shadow: 0 0 10px #00e676; }
  .board-question { margin-top: 15px; text-align: center; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; min-height: 80px; border: 1px solid rgba(255,255,255,0.2); }

  .btn { padding: 12px 24px; background: #00e676; color: #1a237e; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #00c853; margin: 5px; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #00c853; }
  .btn-option { padding: 10px 16px; font-size: 14px; }

  .intro-text { text-align: center; font-size: 18px; color: #b388ff; margin: 15px 0; }
  
  .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
  .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 2s infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="header">
  <h1>👽 Zorglub l'Alien</h1>
  <div style="display:flex;gap:10px;align-items:center;">
    <a href="index.html" style="text-decoration:none;padding:8px 16px;background:#ff7043;border-radius:10px;color:white;font-weight:bold;">🤡 Clown Rigolo</a>
    <div class="stats">
      <span>⭐ <span id="score">0</span></span>
      <span>❤️ <span id="lives">3</span></span>
      <span>🏆 Lv.<span id="level">1</span></span>
    </div>
  </div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

<div class="modes">
  <button class="mode-btn active" data-mode="learn">📚 Learn</button>
  <button class="mode-btn" data-mode="drag">✋ Drag</button>
  <button class="mode-btn" data-mode="listen"> Listen</button>
  <button class="mode-btn" data-mode="memory">🃏 Memory</button>
  <button class="mode-btn" data-mode="speed">⚡ Speed</button>
  <button class="mode-btn" data-mode="board">🎲 Board</button>
</div>

<div class="game-area">
  <div class="feedback" id="feedback"></div>
  <div id="game-content"></div>
  <div class="hint" id="hint">Hover over Zorglub to learn the words!</div>
</div>

<script>
// ===== STARS BACKGROUND =====
function createStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.width = Math.random() * 3 + 1 + 'px';
    star.style.height = star.style.width;
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 2 + 's';
    container.appendChild(star);
  }
}
createStars();

// ===== VOCABULARY — ALIEN BODY PARTS =====
const vocab = [
  { fr: 'la tête', en: 'head', part: 'tete', emoji: '👽' },
  { fr: 'le visage', en: 'face', part: 'visage', emoji: '🟢' },
  { fr: 'les yeux', en: 'eyes (3!)', part: 'yeux', emoji: '👁️' },
  { fr: 'les antennes', en: 'antennae', part: 'antennes', emoji: '📡' },
  { fr: 'la bouche', en: 'mouth', part: 'bouche', emoji: '👄' },
  { fr: 'les bras', en: 'arms (4!)', part: 'bras', emoji: '💪' },
  { fr: 'les mains', en: 'hands (4!)', part: 'mains', emoji: '🖐️' },
  { fr: 'le ventre', en: 'belly', part: 'ventre', emoji: '🫃' },
  { fr: 'les tentacules', en: 'tentacles', part: 'tentacules', emoji: '🦑' },
  { fr: 'les pieds', en: 'feet', part: 'pieds', emoji: '🦶' },
  { fr: 'les cornes', en: 'horns', part: 'cornes', emoji: '🐉' },
  { fr: 'la queue', en: 'tail', part: 'queue', emoji: '🐾' }
];

const functions = [
  { part: 'yeux', func: 'pour voir dans le noir', en: 'to see in the dark' },
  { part: 'antennes', func: 'pour capter les ondes', en: 'to catch waves' },
  { part: 'bras', func: 'pour attraper les objets', en: 'to catch objects', singular: 'bras' },
  { part: 'tentacules', func: 'pour nager dans l\'espace', en: 'to swim in space' },
  { part: 'bouche', func: 'pour manger des étoiles', en: 'to eat stars' },
  { part: 'cornes', func: 'pour briller la nuit', en: 'to glow at night' },
  { part: 'queue', func: 'pour s\'équilibrer', en: 'to balance' }
];

// ===== STATE =====
let state = {
  score: 0, lives: 3, level: 1,
  currentMode: 'learn',
  placed: new Set(),
  answered: new Set(),
  memoryFlipped: [],
  memoryMatched: 0,
  memoryCards: [],
  speedTime: 60,
  speedTimer: null,
  speedScore: 0,
  boardPos: 0,
  boardTotal: 20
};

// ===== SVG ALIEN =====
function getAlienSVG(highlightPart = null) {
  const hl = (id) => highlightPart === id ? 'highlight' : '';
  return `
  <svg viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
    <!-- Antennae -->
    <g class="body-part ${hl('antennes')}" data-part="antennes">
      <line x1="120" y1="60" x2="80" y2="20" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
      <circle cx="80" cy="15" r="8" fill="#00e676"/>
      <line x1="180" y1="60" x2="220" y2="20" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
      <circle cx="220" cy="15" r="8" fill="#00e676"/>
    </g>
    
    <!-- Horns -->
    <g class="body-part ${hl('cornes')}" data-part="cornes">
      <path d="M 100 70 L 70 30 L 80 70 Z" fill="#ff9800"/>
      <path d="M 200 70 L 230 30 L 220 70 Z" fill="#ff9800"/>
    </g>
    
    <!-- Head -->
    <circle class="body-part ${hl('tete')}" data-part="tete"
            cx="150" cy="100" r="60"
            fill="#4caf50" stroke="#2e7d32" stroke-width="4"/>
    
    <!-- Face area -->
    <ellipse class="body-part ${hl('visage')}" data-part="visage"
             cx="150" cy="105" rx="45" ry="40"
             fill="#66bb6a" stroke="#43a047" stroke-width="2"/>
    
    <!-- Three Eyes -->
    <g class="body-part ${hl('yeux')}" data-part="yeux">
      <circle cx="120" cy="95" r="12" fill="white" stroke="#333" stroke-width="2"/>
      <circle cx="120" cy="95" r="6" fill="#e91e63"/>
      <circle cx="180" cy="95" r="12" fill="white" stroke="#333" stroke-width="2"/>
      <circle cx="180" cy="95" r="6" fill="#e91e63"/>
      <circle cx="150" cy="80" r="10" fill="white" stroke="#333" stroke-width="2"/>
      <circle cx="150" cy="80" r="5" fill="#2196f3"/>
    </g>
    
    <!-- Mouth -->
    <ellipse class="body-part ${hl('bouche')}" data-part="bouche"
             cx="150" cy="130" rx="15" ry="8"
             fill="#f44336" stroke="#c62828" stroke-width="2"/>
    
    <!-- Two Mouths (alien feature!) -->
    <ellipse cx="130" cy="145" rx="8" ry="5" fill="#f44336" opacity="0.7"/>
    <ellipse cx="170" cy="145" rx="8" ry="5" fill="#f44336" opacity="0.7"/>
    
    <!-- Body/Belly -->
    <ellipse class="body-part ${hl('ventre')}" data-part="ventre"
             cx="150" cy="200" rx="50" ry="45"
             fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
    <ellipse cx="150" cy="200" rx="35" ry="30" fill="#66bb6a"/>
    <circle cx="150" cy="195" r="8" fill="#ffeb3b"/>
    
    <!-- 4 Arms -->
    <g class="body-part ${hl('bras')}" data-part="bras">
      <!-- Top arms -->
      <ellipse cx="60" cy="180" rx="30" ry="10" fill="#4caf50" transform="rotate(-20 60 180)"/>
      <ellipse cx="240" cy="180" rx="30" ry="10" fill="#4caf50" transform="rotate(20 240 180)"/>
      <!-- Bottom arms -->
      <ellipse cx="55" cy="220" rx="25" ry="8" fill="#4caf50" transform="rotate(-30 55 220)"/>
      <ellipse cx="245" cy="220" rx="25" ry="8" fill="#4caf50" transform="rotate(30 245 220)"/>
    </g>
    
    <!-- 4 Hands -->
    <g class="body-part ${hl('mains')}" data-part="mains">
      <circle cx="30" cy="175" r="12" fill="#81c784"/>
      <circle cx="270" cy="175" r="12" fill="#81c784"/>
      <circle cx="25" cy="230" r="10" fill="#81c784"/>
      <circle cx="275" cy="230" r="10" fill="#81c784"/>
    </g>
    
    <!-- Tentacles instead of legs -->
    <g class="body-part ${hl('tentacules')}" data-part="tentacules">
      <path d="M 120 240 Q 100 300 80 350 Q 70 370 90 380" fill="none" stroke="#4caf50" stroke-width="12" stroke-linecap="round"/>
      <path d="M 180 240 Q 200 300 220 350 Q 230 370 210 380" fill="none" stroke="#4caf50" stroke-width="12" stroke-linecap="round"/>
      <path d="M 140 245 Q 130 310 110 370 Q 100 390 120 400" fill="none" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>
      <path d="M 160 245 Q 170 310 190 370 Q 200 390 180 400" fill="none" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>
    </g>
    
    <!-- Feet at tentacle ends -->
    <g class="body-part ${hl('pieds')}" data-part="pieds">
      <ellipse cx="90" cy="385" rx="15" ry="8" fill="#81c784"/>
      <ellipse cx="210" cy="385" rx="15" ry="8" fill="#81c784"/>
      <ellipse cx="120" cy="405" rx="12" ry="6" fill="#81c784"/>
      <ellipse cx="180" cy="405" rx="12" ry="6" fill="#81c784"/>
    </g>
    
    <!-- Tail -->
    <path class="body-part ${hl('queue')}" data-part="queue"
          d="M 150 245 Q 150 300 200 320 Q 250 340 280 300"
          fill="none" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>
    <circle cx="280" cy="295" r="8" fill="#ff9800"/>
  </svg>`;
}

// ===== TTS =====
function speak(text) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR'; u.rate = 0.85;
    speechSynthesis.speak(u);
  }
}

// ===== FEEDBACK =====
function showFeedback(msg, correct) {
  const f = document.getElementById('feedback');
  f.textContent = msg;
  f.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
  setTimeout(() => f.classList.remove('show'), 1500);
}

function addScore(pts) {
  state.score += pts;
  document.getElementById('score').textContent = state.score;
  updateProgress();
}

function updateProgress() {
  const max = 200;
  const pct = Math.min(100, (state.score / max) * 100);
  document.getElementById('progress').style.width = pct + '%';
  const newLevel = Math.floor(state.score / 30) + 1;
  if (newLevel > state.level) { state.level = newLevel; document.getElementById('level').textContent = state.level; }
}

// ===== MODE SWITCHING =====
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.currentMode = btn.dataset.mode;
    clearInterval(state.speedTimer);
    renderMode();
  });
});

function renderMode() {
  const content = document.getElementById('game-content');
  const hint = document.getElementById('hint');
  switch(state.currentMode) {
    case 'learn': renderLearn(content, hint); break;
    case 'drag': renderDrag(content, hint); break;
    case 'listen': renderListen(content, hint); break;
    case 'memory': renderMemory(content, hint); break;
    case 'speed': renderSpeed(content, hint); break;
    case 'board': renderBoard(content, hint); break;
  }
}

// ===== 1. LEARN =====
function renderLearn(content, hint) {
  hint.innerHTML = '💡 Clique sur une partie du corps pour entendre le mot!';
  content.innerHTML = `
    <p class="intro-text">Explore Zorglub! 👽</p>
    <div class="alien-container">${getAlienSVG()}</div>
    <div class="labels-pool">
      ${vocab.map(v => `<span class="label">${v.fr} <small style="color:#aaa">(${v.en})</small></span>`).join('')}
    </div>
  `;
  attachAlienHandlers(content, (part) => {
    const word = vocab.find(v => v.part === part);
    if (word) { speak(word.fr); showFeedback(word.fr + ' = ' + word.en, true); }
  }, (part) => {
    const word = vocab.find(v => v.part === part);
    if (word) hint.innerHTML = `💡 <b>${word.fr}</b> = ${word.en}`;
  });
}

// ===== 2. DRAG & DROP =====
function renderDrag(content, hint) {
  hint.innerHTML = '💡 Drag each word to the correct body part!';
  const shuffled = [...vocab].sort(() => Math.random() - 0.5);
  state.placed = new Set();
  content.innerHTML = `
    <p class="intro-text">Glisse les mots sur Zorglub!</p>
    <div class="alien-container">${getAlienSVG()}</div>
    <div class="labels-pool" id="labels-pool">
      ${shuffled.map(v => `<div class="label" draggable="true" data-part="${v.part}">${v.fr}</div>`).join('')}
    </div>
    <p style="text-align:center;margin-top:10px;">Placed: <span id="placed-count">0</span>/12</p>
  `;
  setupDragDrop();
}

let draggedPart = null;
document.addEventListener('dragstart', e => {
  if (e.target.classList.contains('label')) {
    draggedPart = e.target.dataset.part;
  }
});

function setupDragDrop() {
  const labels = document.querySelectorAll('.label[draggable]');
  labels.forEach(lbl => {
    lbl.addEventListener('dragstart', e => {
      lbl.classList.add('dragging');
      e.dataTransfer.setData('text/plain', lbl.dataset.part);
    });
    lbl.addEventListener('dragend', () => lbl.classList.remove('dragging'));
  });
  attachAlienHandlers(document.getElementById('game-content'), null, null, true);
}

function attachAlienHandlers(container, onClick, onHover, dragMode = false) {
  container.querySelectorAll('.body-part').forEach(el => {
    if (dragMode) {
      el.addEventListener('dragover', e => { e.preventDefault(); el.style.filter = 'brightness(1.3) drop-shadow(0 0 10px rgba(0,230,118,0.8))'; });
      el.addEventListener('dragleave', () => { el.style.filter = ''; });
      el.addEventListener('drop', e => {
        e.preventDefault();
        el.style.filter = '';
        const targetPart = el.dataset.part;
        if (draggedPart === targetPart && !state.placed.has(draggedPart)) {
          state.placed.add(draggedPart);
          const lbl = document.querySelector(`.label[data-part="${draggedPart}"]`);
          if (lbl) { lbl.classList.add('placed'); lbl.draggable = false; }
          speak(vocab.find(v => v.part === draggedPart).fr);
          showFeedback('✅ Bravo!', true);
          addScore(5);
          document.getElementById('placed-count').textContent = state.placed.size;
          if (state.placed.size === 12) {
            setTimeout(() => { alert('🎉 Félicitations! All 12 placed! +20 bonus!'); addScore(20); }, 500);
          }
        } else {
          showFeedback('❌ Essaie encore!', false);
          state.lives = Math.max(0, state.lives - 1);
          document.getElementById('lives').textContent = state.lives;
        }
        draggedPart = null;
      });
    } else {
      el.addEventListener('click', () => { if (onClick) onClick(el.dataset.part); });
      el.addEventListener('mouseenter', () => { if (onHover) onHover(el.dataset.part); });
    }
  });
}

// ===== 3. LISTEN & CLICK =====
let listenTarget = null;
function renderListen(content, hint) {
  hint.innerHTML = '🔊 Listen and click the correct body part!';
  nextListenQuestion(content, hint);
}

function nextListenQuestion(content, hint) {
  // Filter out already answered items
  const available = vocab.filter(v => !state.answered.has('listen_' + v.part));
  if (available.length === 0) {
    content.innerHTML = `<p class="intro-text">🎉 Bravo! You answered all questions correctly!<br><button class="btn" onclick="state.answered.clear(); renderMode();">🔄 Play Again</button></p>`;
    hint.innerHTML = '💡 All questions answered!';
    return;
  }
  const target = available[Math.floor(Math.random() * available.length)];
  listenTarget = target;
  
  content.innerHTML = `
    <p class="intro-text">🔊 Écoute et clique!<br><small>(Listen and click!)</small></p>
    <button class="btn" id="play-btn">🔊 Réécouter</button>
    <div class="alien-container">${getAlienSVG()}</div>
  `;
  
  document.getElementById('play-btn').addEventListener('click', () => speak(target.fr));
  setTimeout(() => speak(target.fr), 400);
  
  attachAlienHandlers(content, (part) => {
    if (part === listenTarget.part) {
      showFeedback('✅ Correct! ' + listenTarget.fr, true);
      state.answered.add('listen_' + listenTarget.part);
      addScore(10);
      setTimeout(() => nextListenQuestion(content, hint), 1200);
    } else {
      showFeedback('❌ Non! Try again', false);
      state.lives = Math.max(0, state.lives - 1);
      document.getElementById('lives').textContent = state.lives;
      if (state.lives === 0) {
        setTimeout(() => {
          alert('💔 Game Over! Score: ' + state.score);
          state.lives = 3; state.score = Math.max(0, state.score - 20);
          document.getElementById('lives').textContent = 3;
          document.getElementById('score').textContent = state.score;
          nextListenQuestion(content, hint);
        }, 500);
      }
    }
  });
}

// ===== 4. MEMORY =====
function renderMemory(content, hint) {
  hint.innerHTML = '🃏 Find all 12 pairs! (word ↔ emoji)';
  state.memoryFlipped = []; state.memoryMatched = 0;
  const cards = [];
  vocab.forEach(v => {
    cards.push({ id: v.part, text: v.fr, type: 'word' });
    cards.push({ id: v.part, text: v.emoji, type: 'emoji' });
  });
  cards.sort(() => Math.random() - 0.5);
  state.memoryCards = cards;
  
  content.innerHTML = `
    <p class="intro-text">Trouve les paires! — Matched: <span id="mem-count">0</span>/12</p>
    <div class="memory-grid" id="mem-grid">
      ${cards.map((c, i) => `<div class="memory-card" data-idx="${i}">?</div>`).join('')}
    </div>
  `;
  
  document.querySelectorAll('.memory-card').forEach(card => {
    card.addEventListener('click', () => {
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
      if (state.memoryFlipped.length >= 2) return;
      
      const idx = parseInt(card.dataset.idx);
      const data = cards[idx];
      
      card.textContent = data.text;
      card.classList.add('flipped');
      state.memoryFlipped.push({ card, idx, data });
      
      if (state.memoryFlipped.length === 2) {
        const [a, b] = state.memoryFlipped;
        if (a.data.id === b.data.id && a.data.type !== b.data.type) {
          setTimeout(() => {
            a.card.classList.add('matched');
            b.card.classList.add('matched');
            speak(vocab.find(v => v.part === a.data.id).fr);
            state.memoryMatched++;
            document.getElementById('mem-count').textContent = state.memoryMatched;
            addScore(5);
            state.memoryFlipped = [];
            if (state.memoryMatched === 12) {
              setTimeout(() => { alert('🎉 All pairs found! +25 bonus!'); addScore(25); }, 500);
            }
          }, 600);
        } else {
          setTimeout(() => {
            a.card.textContent = '?';
            b.card.textContent = '?';
            a.card.classList.remove('flipped');
            b.card.classList.remove('flipped');
            state.memoryFlipped = [];
          }, 900);
        }
      }
    });
  });
}

// ===== 5. SPEED ROUND =====
function renderSpeed(content, hint) {
  hint.innerHTML = '⚡ 60 seconds! Answer as many as you can!';
  state.speedTime = 60;
  state.speedScore = 0;
  
  content.innerHTML = `
    <p class="intro-text">⚡ Rapid!</p>
    <div class="timer">⏱️ <span id="timer-val">60</span>s</div>
    <div class="speed-prompt" id="speed-prompt">Prêt?</div>
    <div class="alien-container">${getAlienSVG()}</div>
    <p style="text-align:center;">Score this round: <span id="speed-score">0</span></p>
  `;
  
  let currentTarget = null;
  const nextQuestion = () => {
    // Filter out already answered items
    const availableVocab = vocab.filter(v => !state.answered.has('speed_' + v.part));
    const availableFunctions = functions.filter(f => !state.answered.has('speed_' + (f.singular || f.part)));
    
    if (availableVocab.length === 0 && availableFunctions.length === 0) {
      document.getElementById('speed-prompt').textContent = '🎉 All answered! Score: ' + state.speedScore;
      clearInterval(state.speedTimer);
      return;
    }
    
    const useFunction = Math.random() > 0.4 && availableFunctions.length > 0;
    
    if (useFunction) {
      const f = availableFunctions[Math.floor(Math.random() * availableFunctions.length)];
      const targetPart = f.singular || f.part;
      currentTarget = { type: 'function', part: targetPart, text: f.func, key: 'speed_' + targetPart };
      document.getElementById('speed-prompt').innerHTML = `Qu'est-ce qu'on utilise<br><b>${f.func}</b>?`;
      speak(`Qu'est-ce qu'on utilise ${f.func}?`);
    } else {
      const v = availableVocab[Math.floor(Math.random() * availableVocab.length)];
      currentTarget = { type: 'vocab', part: v.part, text: v.fr, key: 'speed_' + v.part };
      document.getElementById('speed-prompt').textContent = 'Où est... ' + v.fr + ' ?';
      speak(v.fr);
    }
  };
  
  setTimeout(nextQuestion, 800);
  
  attachAlienHandlers(content, (part) => {
    if (!currentTarget) return;
    const correct = part === currentTarget.part;
    if (correct) {
      state.answered.add(currentTarget.key);
      state.speedScore++;
      document.getElementById('speed-score').textContent = state.speedScore;
      addScore(3);
      showFeedback('✅', true);
      nextQuestion();
    } else {
      showFeedback('❌', false);
    }
  });
  
  state.speedTimer = setInterval(() => {
    state.speedTime--;
    document.getElementById('timer-val').textContent = state.speedTime;
    if (state.speedTime <= 0) {
      clearInterval(state.speedTimer);
      document.getElementById('speed-prompt').textContent = '⏰ Temps écoulé! Score: ' + state.speedScore;
      setTimeout(() => alert('⏰ Time! You got ' + state.speedScore + ' correct!'), 300);
    }
  }, 1000);
}

// ===== 6. BOARD GAME =====
function renderBoard(content, hint) {
  hint.innerHTML = '🎲 Click the dice to roll! Answer to move.';
  
  content.innerHTML = `
    <p class="intro-text">🎲 Lance le dé et réponds pour avancer!</p>
    
    <div class="board-top">
      <div class="dice" id="dice" title="Click to roll!">🎲</div>
      <div style="font-size:18px;">Position: <b id="board-pos">0</b>/${state.boardTotal-1}</div>
      <div style="font-size:18px;">Roll: <b id="last-roll">-</b></div>
    </div>
    
    <div class="board" id="board-grid">
      ${Array.from({length: state.boardTotal}, (_, i) => {
        let cls = 'board-cell';
        if (i === 0) cls += ' start';
        if (i === state.boardTotal - 1) cls += ' finish';
        return `<div class="${cls}" id="cell-${i}">${i === 0 ? '🏁 Start' : i === state.boardTotal-1 ? '🏁 Finish' : i}</div>`;
      }).join('')}
    </div>
    
    <div class="board-question" id="board-question">
      <p style="font-size:16px;color:#b388ff;">🎲 Click the dice to start!</p>
    </div>
  `;
  
  updateBoardToken();
  document.getElementById('dice').addEventListener('click', rollDice);
}

function rollDice() {
  const dice = document.getElementById('dice');
  if (!dice || dice.classList.contains('rolling')) return;
  
  dice.classList.add('rolling');
  const roll = Math.floor(Math.random() * 6) + 1;
  const diceEmojis = ['⚀','⚁','⚂','⚃','⚄','⚅'];
  
  setTimeout(() => {
    dice.textContent = diceEmojis[roll-1];
    dice.classList.remove('rolling');
    document.getElementById('last-roll').textContent = roll;
    speak(roll.toString());
    setTimeout(() => askBoardQuestion(roll), 400);
  }, 500);
}

function askBoardQuestion(roll) {
  // Filter out already answered items
  const availableVocab = vocab.filter(v => !state.answered.has('board_' + v.part));
  const availableFunctions = functions.filter(f => !state.answered.has('board_' + (f.singular || f.part)));
  
  if (availableVocab.length === 0 && availableFunctions.length === 0) {
    const div = document.getElementById('board-question');
    div.innerHTML = `<p style="color:#00e676;font-size:18px;">🎉 All questions answered!<br><button class="btn" onclick="state.answered.clear(); renderBoard(document.getElementById('game-content'), document.getElementById('hint'));">🔄 Play Again</button></p>`;
    return;
  }
  
  const useFunction = Math.random() > 0.4 && availableFunctions.length > 0;
  let q, correct, options, correctLabel;
  
  if (useFunction) {
    const f = availableFunctions[Math.floor(Math.random() * availableFunctions.length)];
    q = `${f.func} — c'est... ?`;
    correct = f.singular || f.part;
    const allParts = functions.map(x => x.singular || x.part);
    options = [correct, ...allParts.filter(x => x !== correct).slice(0, 2)];
    correctLabel = vocab.find(v => v.part === correct)?.fr || correct;
  } else {
    const v = availableVocab[Math.floor(Math.random() * availableVocab.length)];
    const qType = Math.random() > 0.5;
    if (qType) {
      q = `Comment dit-on "${v.en}" en français?`;
      correct = v.part;
      const allParts = vocab.map(x => x.part);
      options = [correct, ...allParts.filter(x => x !== correct).slice(0, 2)];
      correctLabel = v.fr;
    } else {
      q = `"${v.fr}" — c'est... ?`;
      correct = v.en;
      const allEn = vocab.map(x => x.en);
      options = [v.en, ...allEn.filter(x => x !== v.en).slice(0, 2)];
      correctLabel = v.en;
    }
  }
  
  options.sort(() => Math.random() - 0.5);
  
  const div = document.getElementById('board-question');
  div.innerHTML = `
    <p style="font-size:18px;margin:10px;color:#00e676;font-weight:bold;">${q}</p>
    <div>${options.map(o => {
      const label = (useFunction || (q.includes('dit-on') && !q.includes('c\'est'))) 
        ? (vocab.find(v => v.part === o)?.fr || o) 
        : o;
      return `<button class="btn btn-option" data-val="${o}">${label}</button>`;
    }).join('')}</div>
  `;
  
  div.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.val === correct) {
        showFeedback('✅ Correct!', true);
        // Track answered question
        if (useFunction) {
          state.answered.add('board_' + correct);
        } else {
          const matchedVocab = vocab.find(v => v.part === correct || v.en === correct);
          if (matchedVocab) state.answered.add('board_' + matchedVocab.part);
        }
        const word = vocab.find(v => v.part === correct) || vocab.find(v => v.en === correct);
        if (word) speak(word.fr);
        state.boardPos = Math.min(state.boardTotal - 1, state.boardPos + roll);
        addScore(8);
        updateBoardToken();
        div.innerHTML = `<p style="color:#00e676;font-size:18px;">🎉 Avance de ${roll}! Position: ${state.boardPos}</p>`;
        if (state.boardPos === state.boardTotal - 1) {
          setTimeout(() => { alert('🏆 Bravo! You reached the finish! +30 bonus!'); addScore(30); }, 500);
        }
      } else {
        showFeedback('❌ Wrong! Stay here.', false);
        div.innerHTML = `<p style="color:#ff5252;font-size:16px;"> Mauvaise réponse. Réessaie au prochain tour!</p>`;
      }
    });
  });
}

function updateBoardToken() {
  document.querySelectorAll('.player-token').forEach(t => t.remove());
  const cell = document.getElementById('cell-' + state.boardPos);
  if (cell) {
    const token = document.createElement('div');
    token.className = 'player-token';
    cell.appendChild(token);
  }
  const posEl = document.getElementById('board-pos');
  if (posEl) posEl.textContent = state.boardPos;
}

// ===== INIT =====
renderMode();
</script>
